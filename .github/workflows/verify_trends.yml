name: Verify Trends Scraper

on:
  workflow_dispatch: # 网页端手动一键触发

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run Scraper Verification
        run: |
          python -c "
          import requests
          from bs4 import BeautifulSoup
          import json

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36',
              'Accept-Language': 'en-US,en;q=0.9',
          }
          url = 'https://www.amazon.com/Best-Sellers-Clothing-Shoes-Jewelry/zgbs/fashion/'
          print('>>> Connecting to Amazon US Fashion Bestsellers...')
          resp = requests.get(url, headers=headers, timeout=20)
          print(f'>>> HTTP Status Code: {resp.status_code}')

          items = []
          if resp.status_code == 200:
              soup = BeautifulSoup(resp.text, 'html.parser')
              cards = soup.select('.p13n-grid-content, .zg-grid-general-faceout')[:10]
              for idx, card in enumerate(cards):
                  title_el = card.select_one('._cDEzb_p13n-sc-css-line-clamp-1_1FnBlock, .a-size-small')
                  img_el = card.select_one('img')
                  if title_el and img_el:
                      items.append({
                          'rank': idx + 1,
                          'title': title_el.get_text(strip=True),
                          'image': img_el.get('src', '')
                      })
              print(f'>>> SUCCESS: Extracted {len(items)} trending items!')
              print(json.dumps(items[:3], indent=2, ensure_ascii=False))
          else:
              print('>>> Direct HTML blocked or challenged, status:', resp.status_code)
          "
