name: Verify Trends Scraper

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run Scraper Verification
        run: |
          python -c "
          import requests
          from bs4 import BeautifulSoup
          import json, re

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36',
              'Accept-Language': 'en-US,en;q=0.9',
          }
          url = 'https://www.amazon.com/Best-Sellers-Clothing-Shoes-Jewelry/zgbs/fashion/'
          resp = requests.get(url, headers=headers, timeout=20)
          print(f'>>> HTTP Status: {resp.status_code}')

          items = []
          if resp.status_code == 200:
              soup = BeautifulSoup(resp.text, 'html.parser')
              # 匹配商品卡片
              cards = soup.select('.zg-grid-general-faceout, [id=\"gridItemRoot\"]')[:10]
              for idx, card in enumerate(cards):
                  # 精准提取标题
                  title_el = card.select_one('div[class*=\"_cDEzb_p13n-sc-css-line-clamp-\"]') or card.select_one('.a-link-normal span')
                  # 提取图片并转为全球高清直连 CDN
                  img_el = card.select_one('img')
                  if title_el and img_el:
                      title = title_el.get_text(strip=True)
                      raw_img = img_el.get('src', '')
                      match = re.search(r'/images/I/([A-Za-z0-9+%-]+?)(?:\._.*)?\.(jpg|png|jpeg)', raw_img)
                      clean_img = f'https://m.media-amazon.com/images/I/{match.group(1)}.jpg' if match else raw_img
                      
                      items.append({
                          'rank': idx + 1,
                          'title': title,
                          'image': clean_img
                      })

              print(f'>>> SUCCESS: Extracted {len(items)} items!')
              print(json.dumps(items[:3], indent=2, ensure_ascii=False))
          "
